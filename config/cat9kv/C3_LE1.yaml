---
# C3_LE1.yaml - Catalyst 9000v campus leaf managed by ND 4.3.1 (fabric CAMPUS1); mirror of C1_LE1.
# One fabric link to the campus spine on the highest port the 9-NIC launch provides (GigabitEthernet1/0/8), so
# 1/0/1..1/0/7 stay free for the cisco.nd IOS-XE interface tests. The link was cabled live (`cat9kv.py --attach`).
name: C3_LE1
role: Campus Leaf
sid: 3701
mgmt_bridge: BR_ND_DATA_14
mgmt_ip: 192.168.14.181/24
mgmt_gw: 192.168.14.1
neighbors: [C3_SP1]
isl_bridges: [BR_C3_SP1_LE1_1]
isl_ports: [8]
